<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="tapeYellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="20%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <!-- App Rounded Icon Plate -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#27272a" stroke-width="4"/>

  <!-- Tape Housing Body (Classic Measure Tool) -->
  <circle cx="230" cy="280" r="160" fill="#27272a" stroke="#facc15" stroke-width="8"/>
  <circle cx="230" cy="280" r="110" fill="#18181b"/>
  <circle cx="230" cy="280" r="50" fill="#facc15"/>

  <!-- Yellow Extended Steel Tape Ribbon -->
  <path d="M 230,120 L 440,120 L 440,180 L 230,180 Z" fill="url(#tapeYellow)" stroke="#854d0e" stroke-width="3"/>
  <!-- Graduation Ticks on Ribbon -->
  <line x1="260" y1="120" x2="260" y2="145" stroke="#000" stroke-width="4"/>
  <line x1="290" y1="120" x2="290" y2="135" stroke="#000" stroke-width="3"/>
  <line x1="320" y1="120" x2="320" y2="145" stroke="#000" stroke-width="4"/>
  <line x1="350" y1="120" x2="350" y2="135" stroke="#000" stroke-width="3"/>
  <line x1="380" y1="120" x2="380" y2="155" stroke="#b91c1c" stroke-width="5"/>
  <line x1="410" y1="120" x2="410" y2="135" stroke="#000" stroke-width="3"/>

  <!-- End Hook -->
  <rect x="435" y="115" width="10" height="85" rx="3" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
  <rect x="440" y="175" width="15" height="25" rx="2" fill="#64748b"/>

  <!-- Tactical AR Crosshair Reticle -->
  <circle cx="380" cy="280" r="70" fill="none" stroke="#facc15" stroke-width="4" stroke-dasharray="14 10"/>
  <circle cx="380" cy="280" r="10" fill="#facc15"/>
  <line x1="380" y1="190" x2="380" y2="250" stroke="#facc15" stroke-width="4"/>
  <line x1="380" y1="310" x2="380" y2="370" stroke="#facc15" stroke-width="4"/>
  <line x1="290" y1="280" x2="350" y2="280" stroke="#facc15" stroke-width="4"/>
  <line x1="410" y1="280" x2="470" y2="280" stroke="#facc15" stroke-width="4"/>
</svg>
